services:
  redis:
    image: redis:7-alpine
    container_name: electroquest-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electroquest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electroquest-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@host.docker.internal:5432/elektroquest
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - SOURCE_MATERIALS_ROOT=/source_materials
      - SOURCE_STORAGE_BACKEND=${SOURCE_STORAGE_BACKEND:-local}
      - SOURCE_LOCAL_ROOT=/source_storage
      - SOURCE_MAX_UPLOAD_BYTES=${SOURCE_MAX_UPLOAD_BYTES:-52428800}
      - SOURCE_IMPORT_LEGACY=${SOURCE_IMPORT_LEGACY:-true}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./source_materials:/source_materials:ro
      - source_storage_data:/source_storage
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
      python -m alembic upgrade head &&
      python -m app.commands.import_legacy_sources &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - electroquest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: electroquest-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - electroquest-network

volumes:
  redis_data:
  source_storage_data:

networks:
  electroquest-network:
    driver: bridge
